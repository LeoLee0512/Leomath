# /etc/nginx/conf.d/leomath.conf
# Reverse proxy for LeoMath on the Aliyun ECS host (8.130.33.10).
# The app runs in Docker on 127.0.0.1:3000 (see docker-compose.yml).
# HTTPS: run `certbot --nginx -d leomath.cn -d www.leomath.cn` after this file is in place;
# certbot rewrites the server block with the certificate paths and an HTTP→HTTPS redirect.

# Per-IP request limits (zones must be declared outside the server block; conf.d files are included in http {}).
# Sign-in, sign-up and account pages (and their actions): 20 requests a minute, bursts of 10. CSP reports: 60 a minute.
limit_req_zone $binary_remote_addr zone=leomath_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=leomath_reports:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name leomath.cn www.leomath.cn;

    # Redirect www to the bare domain.
    if ($host = www.leomath.cn) {
        return 301 $scheme://leomath.cn$request_uri;
    }

    client_max_body_size 4m;

    # Long cache for hashed Astro assets (scripts, styles, fonts).
    location /_astro/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sign-in, sign-up and account pages, and the same actions called directly (/_actions/login …).
    location ~ ^/((zh|en)/(login|register|account)(/|$)|_actions/(login|register|deleteAccount)$) {
        limit_req zone=leomath_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/csp-report {
        limit_req zone=leomath_reports burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
