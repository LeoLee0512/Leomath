# /etc/nginx/conf.d/leomath.conf
# Reverse proxy for LeoMath on the Aliyun ECS host (8.130.33.10).
# The app runs in Docker on 127.0.0.1:3000 (see docker-compose.yml).
# HTTPS: run `certbot --nginx -d leomath.cn -d www.leomath.cn` after this file is in place;
# certbot rewrites the server block with the certificate paths and an HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name leomath.cn www.leomath.cn;

    # Redirect www to the bare domain.
    if ($host = www.leomath.cn) {
        return 301 $scheme://leomath.cn$request_uri;
    }

    client_max_body_size 4m;

    # Long cache for hashed Next.js assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
