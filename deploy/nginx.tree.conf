# /etc/nginx/conf.d/tree.leomath.conf
# Leo Tree at tree.leomath.cn. The Leo Tree Docker container publishes 127.0.0.1:3008
# (see LeoLee0512/leotree: docker-compose.yml and docs/DOCKER_DEPLOYMENT.md, which
# ships an identical file as deploy/leotree.tree.leomath.nginx.conf).
# Leo Tree stores knowledge per browser origin, so users of the old bare-IP address
# must export a full backup ZIP and restore it on the new hostname.
# After adding: certbot --nginx -d tree.leomath.cn
server {
    listen 80;
    listen [::]:80;
    server_name tree.leomath.cn;
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
