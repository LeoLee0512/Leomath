# OPTIONAL — /etc/nginx/conf.d/tree.leomath.conf
# Gives Leo Tree a proper hostname instead of the bare IP. Leo Tree's systemd
# service listens on 127.0.0.1:3008 (see LeoLee0512/leotree, deploy/leotree.service).
# Leo Tree stores knowledge per browser origin, so users on https://8.130.33.10/
# must export a full backup ZIP and restore it on the new hostname.
# After adding: certbot --nginx -d tree.leomath.cn
server {
    listen 80;
    listen [::]:80;
    server_name tree.leomath.cn;
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
