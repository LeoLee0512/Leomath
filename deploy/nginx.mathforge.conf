# OPTIONAL — /etc/nginx/conf.d/mathforge.leomath.conf
# MathForge (LeoLee0512/MathLearn) is a static site served on port 8090 by a
# separate nginx instance. This block only gives it a hostname.
# After adding: certbot --nginx -d mathforge.leomath.cn
server {
    listen 80;
    listen [::]:80;
    server_name mathforge.leomath.cn;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
