services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leomath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: leomath
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leomath -d leomath"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://leomath.cn}
        CSP_ENFORCE: ${CSP_ENFORCE:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://leomath:${POSTGRES_PASSWORD:-change-me}@db:5432/leomath
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://leomath.cn}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ICP_NUMBER: ${ICP_NUMBER:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
